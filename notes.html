<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>frdyy</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
    </head>

    <body>
        <div class="mainc">

            <!-- including title and maybe some links/info -->
            <div class="headerc">
                <h1 id="title">Frederik Kockisch</h1>
                <div class="tags">
                    <p>based in <span class="infotag">Hamburg, Germany</span></p>
                    <p>@ <span class="infotag">Université Paris-Saclay</span></p>
                </div>

            </div>

            <!-- divider placeholder -->
            <div class="divide"></div>

            <div class="aboutc">
                <!-- navbar for sections below it -->
                <nav class="section-nav">
                    <ul class="section-ul">
                        <li><a href="index.html">about me</a></li>
                        <li><a href="projects.html">projects</a></li>
                        <li><a href="notes.html">notes.md</a></li>
                    </ul>
                </nav>

                <div class="sectionc markdown"></div>
            </div>

        </div>

        <script>
            async function loadNotes() {
                const response = await fetch("notes.md");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                document.querySelector(".sectionc").innerHTML = marked.parse(await response.text());
            }

            loadNotes();
        </script>
    </body>
</html>
